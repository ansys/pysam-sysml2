ci:
  autofix_commit_msg: 'chore: auto fixes from pre-commit hooks'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/ansys/pre-commit-hooks
    rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
    hooks:
      - id: add-license-headers
        args:
          - --start_year=2024
        # v0.8.0 rewrites (\d{4})-(\d{4}) globally; this UUID contains 4777-9671.
        exclude: |
          (?x)^(
              tests/unit/const\.py|
              tests/unit/sam/sysml2/builder/test_noname_lookup\.py|
              examples/code/example_identifiers.py.template
          )$

  - repo: https://github.com/numpy/numpydoc
    rev: 9c52969be60d16e0e5e758d3f5d9a2c802e9a232  # frozen: v1.11.0
    hooks:
      - id: numpydoc-validation
        files: \.py$
        exclude: |
          (?x)^(
              tests/|
              doc/source/_static/code/|
              examples/code/
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args:
        - -L THIRDPARTY
        - --ignore-words=.codespellignorewords
        # Configuration word needed in pyproject.toml
        exclude: |
          (?x)^(
              tests/unit/modeltestset/
          )

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-yaml

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: 500543de231a91e6157db630075d70320709b834  # frozen: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config
