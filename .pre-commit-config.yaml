ci:
  autofix_commit_msg: 'chore: auto fixes from pre-commit hooks'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/ansys/pre-commit-hooks
    rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
    hooks:
      - id: add-license-headers
        args:
          - --start_year=2024
        # v0.8.0 rewrites (\d{4})-(\d{4}) globally; this UUID contains 4777-9671.
        exclude: |
          (?x)^(
              tests/unit/const\.py|
              tests/unit/sam/sysml2/builder/test_noname_lookup\.py
          )$

  - repo: https://github.com/numpy/numpydoc
    rev: 16a20aad58d5532fb12c2a87af0eb4ea290bacb4  # frozen: v1.10.0
    hooks:
      - id: numpydoc-validation
        files: \.py$
        exclude: |
          (?x)^(
              tests/|
              doc/source/_static/code/|
              examples/code/
          )

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a27a2e47c7751b639d2b5badf0ef6ff11fee893f  # frozen: v0.15.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args:
        - -L THIRDPARTY
        - --ignore-words=.codespellignorewords
        # Configuration word needed in pyproject.toml
        exclude: |
          (?x)^(
              tests/unit/modeltestset/
          )

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-yaml

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # frozen: 0.38.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: 500543de231a91e6157db630075d70320709b834  # frozen: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config
